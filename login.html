<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود | شایان‌نت</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <input type="checkbox" id="theme-toggle" class="theme-toggle">
  <div class="site-wrapper">

  <header class="site-header">
    <div class="container header-inner">
      <div class="theme-control">
        <label for="theme-toggle" class="theme-label">
          <span class="light-text">☀️ روشن</span>
          <span class="dark-text">🌙 تاریک</span>
        </label>
      </div>
      <a class="logo" href="index.html">شایان‌نت</a>
<nav class="nav">
        <a href="index.html">صفحه اصلی</a>
        <a href="products.html">محصولات</a>
        <a class="active" href="login.html">ورود</a>
        <a href="register.html">ثبت‌نام</a>
      </nav>
    </div>
  </header>

  <main class="container form-page">
    <form class="form-card" action="#" method="get">
      <span class="eyebrow">خوش برگشتی</span>
      <h1>ورود به شایان‌نت</h1>
      <p class="muted">برای ورود، اطلاعات حساب خود را وارد کن.</p>

      <label for="login-user">شماره موبایل یا ایمیل</label>
      <input id="login-user" name="username" type="text" placeholder="شماره موبایل یا ایمیل" required>

      <label for="login-password">رمز عبور</label>
      <input id="login-password" name="password" type="password" placeholder="رمز عبور" required>

      <button class="btn form-submit" type="submit">ورود</button>
      <p class="form-note">حساب کاربری نداری؟ <a href="register.html">ثبت‌نام کن</a></p>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <a class="logo footer-logo" href="index.html">شایان‌نت</a>
      <p>تمام حقوق این وب‌سایت برای شایان‌نت محفوظ است.</p>
    </div>
  </footer>
  </div>
</body>
</html>
