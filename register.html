<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ثبت‌نام | شایان‌نت</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <input type="checkbox" id="theme-toggle" class="theme-toggle">
  <div class="site-wrapper">

  <header class="site-header">
    <div class="container header-inner">
      <div class="theme-control">
        <label for="theme-toggle" class="theme-label">
          <span class="light-text">☀️ روشن</span>
          <span class="dark-text">🌙 تاریک</span>
        </label>
      </div>
      <a class="logo" href="index.html">شایان‌نت</a>
<nav class="nav">
        <a href="index.html">صفحه اصلی</a>
        <a href="products.html">محصولات</a>
        <a href="login.html">ورود</a>
        <a class="active" href="register.html">ثبت‌نام</a>
      </nav>
    </div>
  </header>

  <main class="container form-page">
    <form class="form-card" action="#" method="get">
      <span class="eyebrow">به خانواده ما بپیوند</span>
      <h1>ساخت حساب کاربری</h1>
      <p class="muted">اطلاعات زیر را وارد کن.</p>

      <label for="fullname">نام و نام خانوادگی</label>
      <input id="fullname" name="fullname" type="text" placeholder="نام کامل" required>

      <label for="register-email">ایمیل</label>
      <input id="register-email" name="email" type="email" placeholder="example@email.com" required>

      <label for="mobile">شماره موبایل</label>
      <input id="mobile" name="mobile" type="tel" placeholder="شماره موبایل" required>

      <label for="register-password">رمز عبور</label>
      <input id="register-password" name="password" type="password" placeholder="حداقل ۸ کاراکتر" minlength="8" required>

      <button class="btn form-submit" type="submit">ثبت‌نام</button>
      <p class="form-note">قبلاً حساب ساخته‌ای؟ <a href="login.html">وارد شو</a></p>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <a class="logo footer-logo" href="index.html">شایان‌نت</a>
      <p>تمام حقوق این وب‌سایت برای شایان‌نت محفوظ است.</p>
    </div>
  </footer>
  </div>
</body>
</html>
